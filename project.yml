name: Sorty
options:
  bundleIdPrefix: com.fulltimestudio
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7WHQR6L96K
    DEVELOPMENT_LANGUAGE: en
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    # Xcode 27 template default. Deliberately paired with the *nonisolated*
    # default actor isolation: SortyKit is shared with a hostless test target
    # and its services must stay off the main actor, so isolation is annotated
    # explicitly rather than inferred.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES

schemes:
  Sorty:
    build:
      targets:
        Sorty: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SortyTests

targets:
  Sorty:
    type: application
    platform: iOS
    sources:
      - Sorty
      - SortyKit
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.sorty
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Sorty/App/Info.plist
      properties:
        CFBundleDisplayName: Sorty
        # Not empty any more, and not a brand card either.
        #
        # The Human Interface Guidelines prohibit a branded launch screen: it
        # "isn't an opportunity for artistic expression", and logos are excluded
        # "unless they're a fixed part of your app's first screen". The whole
        # vocabulary available here is a colour, an image, a safe-area flag and
        # empty bars - no text, no layout, no animation.
        #
        # So the sanctioned job is to *resemble the first screen*, making the
        # handoff invisible rather than a flash. `LaunchBackground` is
        # `SortyTheme.background` in both Appearances, which is exactly what
        # the library renders on. An empty dictionary here would still satisfy
        # TN3208's upload requirement, but it would flash white into a tinted
        # screen, and near-white into a near-black one.
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        # PKCE callback. Must be registered verbatim in the Spotify dashboard.
        CFBundleURLTypes:
          - CFBundleURLName: com.fulltimestudio.sorty.auth
            CFBundleURLSchemes: [sorty]

  # Hostless: SortyKit is pure logic + URLSession, so the tests need no app
  # process. Same arrangement as Prelys.
  SortyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - SortyKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.sorty.tests
        GENERATE_INFOPLIST_FILE: YES
