# The production channel: a version tag.
#
# Tags are the only trigger. A branch cannot publish a release, which is what
# keeps "what shipped" a thing you can point at rather than infer from history.
#
#   v0.2.0         a release. Published as a GitHub Release.
#   v0.2.0-beta.1  a pre-release. Same build, flagged as a pre-release, so it
#                  never becomes the "Latest" badge on the repository.
#
# The first job blocks and needs no Xcode: it asserts the tag and project.yml
# agree. A tag that says 0.2.0 over a tree that says 0.1.0 produces a build
# whose bundle disagrees with its own release notes, and that is discovered by
# a listener rather than by CI unless something checks it here.
#
# **App Store submission is deliberately not automated yet.** Sorty targets
# iOS 27 and Apple has not opened App Store submissions for Xcode 27 builds -
# see the README. So production today means a signed archive and a published
# GitHub Release; TestFlight remains where builds reach people. When
# submissions open, the upload step below is the one that changes.
#
# Uses the same secrets as beta.yml. Without them, this job still verifies,
# builds unsigned and publishes the Release - only the .ipa is missing. That is
# the one degraded outcome worth having: an unsigned build still proves the tree
# compiles and links.
#
# A FAILED build is different, and blocks publishing entirely. Until a hosted
# image carries Xcode 27, that means every tag fails here rather than publishing
# an empty Release - which is the honest outcome, and the same reason `checks`
# blocks in ci.yml while `test` does not. Register a self-hosted runner with
# Xcode 27 to lift it.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # required to create the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a half-published release

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse the tag
        id: parse
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not vX.Y.Z or vX.Y.Z-beta.N"; exit 1 ;;
          esac
          version="${TAG#v}"
          version="${version%%-*}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$version" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is a pre-release of $version"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is a release of $version"
          fi

      - name: The tag agrees with project.yml
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/version.sh check "$TAG"

      - name: The changelog has an entry for this version
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section. Add one before tagging - see RELEASING.md."
            exit 1
          fi
          echo "CHANGELOG.md has a section for ${VERSION}"

  build:
    name: Production build
    needs: verify
    runs-on: macos-latest
    # NOT advisory, unlike ci.yml's test job. A tag is a claim that something
    # shippable exists; publishing a Release whose build failed makes that claim
    # falsely, and quietly - the Release appears, with no archive attached and
    # nothing on its page to say why. So this job blocks `publish` below.
    env:
      XCODE_VERSION: '27.0'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          target="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$target" ]; then
            sudo xcode-select -s "$target"
          else
            echo "::warning::Xcode ${XCODE_VERSION} is not on this runner; using $(xcodebuild -version | head -1)."
          fi

      - name: Do we have signing credentials?
        id: creds
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets set. Building unsigned; no .ipa will be attached."
          fi

      - name: Stamp the build number
        run: |
          stamp="$(date -u +%Y%m%d).$(date -u +%H%M)"
          ./scripts/version.sh set-build "$stamp"
          echo "Version $(./scripts/version.sh) build $(./scripts/version.sh build)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Build unsigned
        if: steps.creds.outputs.signed == 'false'
        run: |
          set -o pipefail
          xcodebuild -project Sorty.xcodeproj -scheme Sorty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Import the signing certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          keychain=build.keychain
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"
          rm -f /tmp/cert.p12
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision

      - name: Archive and export
        if: steps.creds.outputs.signed == 'true'
        run: |
          set -o pipefail
          xcodebuild -project Sorty.xcodeproj -scheme Sorty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Sorty.xcarchive \
            archive
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>7WHQR6L96K</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/Sorty.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Upload to TestFlight
        if: steps.creds.outputs.signed == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f build/export/Sorty.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -rf ~/.appstoreconnect/private_keys

      - name: Keep the archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sorty-${{ github.ref_name }}
          path: |
            build/export/*.ipa
            build/Build/Products/Release-iphoneos/Sorty.app
          retention-days: 90
          if-no-files-found: warn

      - name: Clean up the keychain
        if: always() && steps.creds.outputs.signed == 'true'
        run: security delete-keychain build.keychain || true

  publish:
    name: Publish the GitHub Release
    needs: [verify, build]
    # Both must have succeeded. `always()` is deliberately absent: a skipped or
    # cancelled build must not publish either, and the default `success()` would
    # already cover it - the explicit results are here so the intent survives
    # someone re-adding `always()` to debug something.
    if: needs.verify.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cut the notes out of the changelog
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # Everything between this version's heading and the next one. The
          # link-reference block at the foot of the file also ends a section -
          # without that second rule the OLDEST version's notes swallow it,
          # since nothing else follows it.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]"  { found = 1; next }
            found && /^## \[/        { exit }
            found && /^\[[^]]+\]: /  { exit }
            found                    { print }
          ' CHANGELOG.md > notes.md
          # Trim leading and trailing blank lines.
          sed -i -e '/./,$!d' notes.md
          printf '%s\n' "$(cat notes.md)" > notes.md
          if [ ! -s notes.md ]; then
            echo "No notes found for ${VERSION}" > notes.md
          fi
          echo "--- release notes ---"
          cat notes.md

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: sorty-${{ github.ref_name }}
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          args=(--title "Sorty $TAG" --notes-file notes.md)
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          files=$(find artifacts -type f -name '*.ipa' 2>/dev/null || true)
          gh release create "$TAG" "${args[@]}" $files
