# The beta channel: every push to a release branch.
#
# A release branch is stabilising, so what it owes is proof that it still
# builds and a build people can actually install. This workflow always does the
# first and does the second only when the signing secrets exist.
#
# **Why the gate is a step output rather than `if: secrets.X != ''`.** GitHub
# does not expose the `secrets` context to `if` conditions at either job or step
# level - the expression silently evaluates to empty and the job runs anyway,
# failing later and less legibly. So one step reads the secrets into an output
# and everything downstream keys off that. This is the documented workaround,
# not a preference.
#
# Until App Store Connect credentials are added, this workflow builds unsigned
# and uploads the .app as an artifact. That is not a placeholder: an unsigned
# build catches every compile and link error a signed one would, which is the
# thing a release branch most needs to know.
#
# Secrets it will use once they exist - see RELEASING.md for how to mint them:
#   APPLE_CERTIFICATE_P12         base64 of the distribution certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD    its export password
#   APPLE_PROVISIONING_PROFILE    base64 of the App Store provisioning profile
#   APP_STORE_CONNECT_KEY_ID      App Store Connect API key id
#   APP_STORE_CONNECT_ISSUER_ID   its issuer id
#   APP_STORE_CONNECT_KEY_P8      base64 of the .p8 private key

name: Beta

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

jobs:
  beta:
    name: Beta build
    runs-on: macos-latest
    # Advisory for the same reason as the test job in ci.yml and the build job
    # in release.yml: until a hosted image carries Xcode 27, this fails for
    # toolchain reasons rather than code reasons, and a check that is always red
    # is a check nobody reads. Drop this the same day ci.yml's does.
    continue-on-error: true
    env:
      XCODE_VERSION: '27.0'
    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain this runner has
        run: |
          ls /Applications | grep -i '^Xcode' || echo "(none found)"
          xcodebuild -version || true

      - name: Select Xcode
        run: |
          target="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ -d "$target" ]; then
            sudo xcode-select -s "$target"
          else
            echo "::warning::Xcode ${XCODE_VERSION} is not on this runner; using $(xcodebuild -version | head -1)."
          fi

      - name: Do we have signing credentials?
        id: creds
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -n "$CERT" ] && [ -n "$KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing credentials present - will archive and upload."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing secrets set. Building unsigned; nothing will be uploaded to TestFlight."
          fi

      - name: Stamp the build number
        # A UTC timestamp, so Beta and Release never have to agree on a shared
        # counter and a build number can never go backwards. The marketing
        # version is NOT touched here - it is whatever the branch says, set
        # deliberately when the branch was cut.
        run: |
          stamp="$(date -u +%Y%m%d).$(date -u +%H%M)"
          ./scripts/version.sh set-build "$stamp"
          echo "Version $(./scripts/version.sh) build $(./scripts/version.sh build)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Test
        # A release branch that does not pass its own tests is not stabilising.
        # Advisory for the same toolchain reason as CI; see ci.yml.
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild -project Sorty.xcodeproj -scheme Sorty \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            CODE_SIGNING_ALLOWED=NO test

      - name: Build unsigned
        if: steps.creds.outputs.signed == 'false'
        run: |
          set -o pipefail
          xcodebuild -project Sorty.xcodeproj -scheme Sorty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload the unsigned app
        if: steps.creds.outputs.signed == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sorty-beta-unsigned
          path: build/Build/Products/Release-iphoneos/Sorty.app
          retention-days: 14
          if-no-files-found: warn

      # ---- Signed path. Inert until the secrets above exist. ----

      - name: Import the signing certificate
        if: steps.creds.outputs.signed == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          keychain=build.keychain
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain

          echo "$CERT" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain"
          rm -f /tmp/cert.p12

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/beta.mobileprovision

      - name: Archive and export
        if: steps.creds.outputs.signed == 'true'
        run: |
          set -o pipefail
          xcodebuild -project Sorty.xcodeproj -scheme Sorty \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Sorty.xcarchive \
            archive

          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>7WHQR6L96K</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Sorty.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Upload to TestFlight
        if: steps.creds.outputs.signed == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_P8" | base64 --decode \
            > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/export/Sorty.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"
          rm -rf ~/.appstoreconnect/private_keys

      - name: Clean up the keychain
        if: always() && steps.creds.outputs.signed == 'true'
        run: security delete-keychain build.keychain || true
